name: RITMO Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --org com.ritmo --project-name ritmo /tmp/ritmo_scaffold

      - name: Add Android platform files
        run: cp -R /tmp/ritmo_scaffold/android/. ./android/

      - name: Configure Android alarm permissions and receivers
        run: python3 tool/configure_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename APK to RITMO.apk
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/RITMO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RITMO-ANDROID-APK
          path: build/app/outputs/flutter-apk/RITMO.apk
          if-no-files-found: error
          retention-days: 14
